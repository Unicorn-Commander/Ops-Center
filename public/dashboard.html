<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UC-1 Pro Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .dashboard-container {
            max-width: 1400px;
            margin: 0 auto;
        }

        /* Top Bar */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 40px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            padding: 20px 30px;
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        }

        .logo-section {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .logo-section h1 {
            color: white;
            font-size: 24px;
            font-weight: 600;
        }

        .user-section {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .user-info {
            text-align: right;
            color: white;
        }

        .user-name {
            font-weight: 600;
            font-size: 16px;
            margin-bottom: 4px;
        }

        .user-tier {
            font-size: 12px;
            opacity: 0.9;
            padding: 4px 12px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            display: inline-block;
        }

        .user-avatar {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 600;
            font-size: 20px;
            cursor: pointer;
            position: relative;
            transition: transform 0.2s;
        }

        .user-avatar:hover {
            transform: scale(1.05);
        }

        .avatar-menu {
            display: none;
            position: absolute;
            top: 60px;
            right: 0;
            background: white;
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.15);
            min-width: 200px;
            overflow: hidden;
            z-index: 1000;
        }

        .avatar-menu.show {
            display: block;
        }

        .menu-item {
            padding: 12px 20px;
            cursor: pointer;
            transition: background 0.2s;
            color: #333;
            text-decoration: none;
            display: block;
        }

        .menu-item:hover {
            background: #f5f5f5;
        }

        .menu-item.danger {
            color: #e74c3c;
            border-top: 1px solid #eee;
        }

        /* Welcome Section */
        .welcome-section {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            padding: 30px;
            border-radius: 16px;
            margin-bottom: 30px;
            color: white;
        }

        .welcome-section h2 {
            font-size: 28px;
            margin-bottom: 10px;
        }

        .welcome-section p {
            opacity: 0.9;
            font-size: 16px;
        }

        /* Services Grid */
        .services-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 24px;
            margin-bottom: 30px;
        }

        .service-card {
            background: white;
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            transition: all 0.3s ease;
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }

        .service-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 48px rgba(0, 0, 0, 0.15);
        }

        .service-card.locked {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .service-card.locked:hover {
            transform: none;
        }

        .service-icon {
            width: 64px;
            height: 64px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            margin-bottom: 20px;
        }

        .service-title {
            font-size: 20px;
            font-weight: 600;
            color: #333;
            margin-bottom: 10px;
        }

        .service-description {
            color: #666;
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 15px;
        }

        .service-status {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            color: #888;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #4caf50;
        }

        .status-dot.locked {
            background: #999;
        }

        .lock-badge {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.1);
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 11px;
            font-weight: 600;
            color: #666;
        }

        /* Loading State */
        .loading {
            text-align: center;
            padding: 60px 20px;
            color: white;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Responsive */
        @media (max-width: 768px) {
            .services-grid {
                grid-template-columns: 1fr;
            }

            .top-bar {
                flex-direction: column;
                gap: 20px;
            }

            .user-info {
                text-align: center;
            }
        }
    </style>
</head>
<body>
    <div class="dashboard-container">
        <!-- Loading State -->
        <div id="loading" class="loading">
            <div class="spinner"></div>
            <p>Loading your dashboard...</p>
        </div>

        <!-- Dashboard Content (hidden initially) -->
        <div id="dashboard" style="display: none;">
            <!-- Top Bar -->
            <div class="top-bar">
                <div class="logo-section">
                    <h1>🦄 UC-1 Pro Operations Center</h1>
                </div>
                <div class="user-section">
                    <div class="user-info">
                        <div class="user-name" id="userName">Loading...</div>
                        <div class="user-tier" id="userTier">Trial</div>
                    </div>
                    <div class="user-avatar" id="userAvatar" onclick="toggleAvatarMenu()">
                        <span id="avatarInitial">U</span>
                        <div class="avatar-menu" id="avatarMenu">
                            <a href="/profile" class="menu-item">👤 Profile Settings</a>
                            <a href="/api-keys" class="menu-item">🔑 API Keys (BYOK)</a>
                            <a href="/usage" class="menu-item">📊 Usage & Billing</a>
                            <div id="adminMenuItem" style="display: none;">
                                <a href="/admin" class="menu-item">⚙️ Admin Panel</a>
                            </div>
                            <a href="#" onclick="logout()" class="menu-item danger">🚪 Logout</a>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Welcome Section -->
            <div class="welcome-section">
                <h2 id="welcomeMessage">Welcome back!</h2>
                <p id="welcomeDescription">Access your services and manage your account</p>
            </div>

            <!-- Services Grid -->
            <div class="services-grid" id="servicesGrid">
                <!-- Services will be loaded dynamically -->
            </div>
        </div>
    </div>

    <script>
        let userData = null;

        // Service definitions with tier requirements
        const services = [
            {
                id: 'ops-center',
                title: 'Operations Center',
                description: 'Main command center for system management and monitoring',
                icon: '🎛️',
                url: '/ops',
                tier: 'trial',
                status: 'active'
            },
            {
                id: 'chat',
                title: 'Open-WebUI Chat',
                description: 'AI-powered chat interface with multiple LLM models',
                icon: '💬',
                url: 'https://chat.unicorncommander.ai',
                tier: 'trial',
                status: 'active'
            },
            {
                id: 'search',
                title: 'Center-Deep Search',
                description: 'Advanced AI search and research assistant',
                icon: '🔍',
                url: 'https://search.unicorncommander.ai',
                tier: 'starter',
                status: 'active'
            },
            {
                id: 'billing',
                title: 'Billing Portal',
                description: 'Manage subscriptions, payments, and invoices',
                icon: '💳',
                url: '/billing',
                tier: 'professional',
                status: 'active'
            },
            {
                id: 'litellm',
                title: 'LiteLLM Proxy',
                description: 'Unified API gateway for multiple LLM providers',
                icon: '🔌',
                url: '/litellm',
                tier: 'professional',
                status: 'active'
            },
            {
                id: 'voice',
                title: 'TTS/STT Services',
                description: 'Text-to-Speech and Speech-to-Text processing',
                icon: '🎤',
                url: '/voice',
                tier: 'professional',
                status: 'active'
            },
            {
                id: 'admin',
                title: 'Admin Dashboard',
                description: 'System administration and user management',
                icon: '⚙️',
                url: '/admin',
                tier: 'admin',
                status: 'active'
            },
            {
                id: 'admin-subscriptions',
                title: 'Subscription Management',
                description: 'Manage user subscriptions, billing, and usage analytics',
                icon: '👑',
                url: '/admin/subscriptions.html',
                tier: 'admin',
                status: 'active'
            }
        ];

        // Tier hierarchy
        const tierLevels = {
            'trial': 0,
            'starter': 1,
            'professional': 2,
            'enterprise': 3,
            'admin': 999
        };

        // Fetch user data on page load
        async function loadUserData() {
            try {
                const response = await fetch('/auth/user', {
                    credentials: 'include'
                });

                if (!response.ok) {
                    throw new Error('Not authenticated');
                }

                userData = await response.json();
                renderDashboard();
            } catch (error) {
                console.error('Authentication error:', error);
                window.location.href = '/login.html';
            }
        }

        // Render dashboard with user data
        function renderDashboard() {
            // Update user info
            document.getElementById('userName').textContent = userData.name || userData.email;
            document.getElementById('userTier').textContent = formatTier(userData.tier || 'trial');

            // Set avatar initial
            const initial = (userData.name || userData.email).charAt(0).toUpperCase();
            document.getElementById('avatarInitial').textContent = initial;

            // Update welcome message
            document.getElementById('welcomeMessage').textContent = `Welcome back, ${userData.name || 'User'}!`;
            document.getElementById('welcomeDescription').textContent = `${formatTier(userData.tier || 'trial')} Account • ${userData.email}`;

            // Show admin menu item if user is admin
            if (userData.is_admin) {
                document.getElementById('adminMenuItem').style.display = 'block';
            }

            // Render services
            renderServices();

            // Hide loading, show dashboard
            document.getElementById('loading').style.display = 'none';
            document.getElementById('dashboard').style.display = 'block';
        }

        // Render services based on user tier
        function renderServices() {
            const grid = document.getElementById('servicesGrid');
            grid.innerHTML = '';

            const userTierLevel = tierLevels[userData.tier?.toLowerCase() || 'trial'] || 0;

            services.forEach(service => {
                const serviceTierLevel = tierLevels[service.tier.toLowerCase()] || 0;
                const hasAccess = userData.is_admin ||
                                 service.tier === 'admin' ? userData.is_admin : userTierLevel >= serviceTierLevel;

                const card = createServiceCard(service, hasAccess);
                grid.appendChild(card);
            });
        }

        // Create service card element
        function createServiceCard(service, hasAccess) {
            const card = document.createElement('div');
            card.className = `service-card ${!hasAccess ? 'locked' : ''}`;

            if (hasAccess) {
                card.onclick = () => window.location.href = service.url;
            }

            card.innerHTML = `
                <div class="service-icon">${service.icon}</div>
                <div class="service-title">${service.title}</div>
                <div class="service-description">${service.description}</div>
                <div class="service-status">
                    <div class="status-dot ${!hasAccess ? 'locked' : ''}"></div>
                    <span>${hasAccess ? 'Available' : `Requires ${formatTier(service.tier)}`}</span>
                </div>
                ${!hasAccess ? `<div class="lock-badge">🔒 ${formatTier(service.tier).toUpperCase()}</div>` : ''}
            `;

            return card;
        }

        // Format tier name
        function formatTier(tier) {
            const tierMap = {
                'trial': 'Trial',
                'starter': 'Starter',
                'professional': 'Professional',
                'enterprise': 'Enterprise',
                'admin': 'Administrator'
            };
            return tierMap[tier.toLowerCase()] || tier;
        }

        // Toggle avatar menu
        function toggleAvatarMenu() {
            const menu = document.getElementById('avatarMenu');
            menu.classList.toggle('show');
        }

        // Close menu when clicking outside
        document.addEventListener('click', (event) => {
            const avatar = document.getElementById('userAvatar');
            const menu = document.getElementById('avatarMenu');

            if (!avatar.contains(event.target)) {
                menu.classList.remove('show');
            }
        });

        // Logout function
        async function logout() {
            try {
                await fetch('/auth/logout', {
                    method: 'POST',
                    credentials: 'include'
                });
            } catch (error) {
                console.error('Logout error:', error);
            }

            window.location.href = '/login.html';
        }

        // Initialize dashboard
        loadUserData();
    </script>
</body>
</html>
