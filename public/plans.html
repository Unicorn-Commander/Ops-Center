<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Subscription Plans - UC-1 Pro</title>
    <link rel="icon" type="image/png" href="the-colonel-logo.png">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #1a0033 0%, #220044 25%, #0a1929 50%, #3a0e5a 75%, #1a0033 100%);
            background-size: 400% 400%;
            animation: galaxyShift 20s ease infinite;
            min-height: 100vh;
            color: white;
            padding: 2rem;
        }

        @keyframes galaxyShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            margin-bottom: 3rem;
        }

        .header h1 {
            font-size: 3rem;
            font-weight: 700;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #ffd700 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 1rem;
        }

        .header p {
            font-size: 1.2rem;
            color: rgba(255, 255, 255, 0.8);
        }

        .plans-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 2rem;
            margin-bottom: 3rem;
        }

        .plan-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 2rem;
            transition: all 0.3s ease;
            position: relative;
        }

        .plan-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 20px 60px rgba(102, 126, 234, 0.3);
            border-color: rgba(102, 126, 234, 0.5);
        }

        .plan-card.popular {
            border: 2px solid #ffd700;
            box-shadow: 0 10px 40px rgba(255, 215, 0, 0.3);
        }

        .popular-badge {
            position: absolute;
            top: -15px;
            right: 20px;
            background: linear-gradient(135deg, #ffd700, #ffed4e);
            color: #1a0033;
            padding: 0.5rem 1.5rem;
            border-radius: 25px;
            font-weight: 600;
            font-size: 0.9rem;
            box-shadow: 0 4px 15px rgba(255, 215, 0, 0.4);
        }

        .plan-name {
            font-size: 1.8rem;
            font-weight: 700;
            margin-bottom: 1rem;
            background: linear-gradient(135deg, #667eea, #ffd700);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .plan-price {
            font-size: 3rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
        }

        .plan-price span {
            font-size: 1.2rem;
            font-weight: 400;
            color: rgba(255, 255, 255, 0.6);
        }

        .plan-billing {
            color: rgba(255, 255, 255, 0.6);
            margin-bottom: 2rem;
            font-size: 0.9rem;
        }

        .plan-features {
            list-style: none;
            margin-bottom: 2rem;
        }

        .plan-features li {
            padding: 0.75rem 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .plan-features li:last-child {
            border-bottom: none;
        }

        .plan-features li::before {
            content: "✓";
            color: #4ade80;
            font-weight: bold;
            font-size: 1.2rem;
        }

        .plan-button {
            width: 100%;
            padding: 1rem 2rem;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .plan-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.5);
        }

        .plan-button.primary {
            background: linear-gradient(135deg, #ffd700 0%, #ffed4e 100%);
            color: #1a0033;
        }

        .back-link {
            display: inline-block;
            margin-top: 2rem;
            padding: 1rem 2rem;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            color: white;
            text-decoration: none;
            transition: all 0.3s ease;
        }

        .back-link:hover {
            background: rgba(255, 255, 255, 0.15);
            transform: translateY(-2px);
        }

        .loading {
            text-align: center;
            padding: 4rem;
            font-size: 1.5rem;
            color: rgba(255, 255, 255, 0.6);
        }

        .error {
            text-align: center;
            padding: 2rem;
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.3);
            border-radius: 12px;
            color: #fca5a5;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Choose Your Plan</h1>
            <p>Select the perfect plan for your AI needs. Upgrade or downgrade anytime.</p>
        </div>

        <div id="loading" class="loading">
            Loading plans...
        </div>

        <div id="error" class="error" style="display: none;">
            Failed to load subscription plans. Please try again later.
        </div>

        <div id="plans-grid" class="plans-grid" style="display: none;">
            <!-- Plans will be loaded here dynamically -->
        </div>

        <div style="text-align: center;">
            <a href="/" class="back-link">← Back to Dashboard</a>
        </div>
    </div>

    <script>
        // Load plans on page load
        document.addEventListener('DOMContentLoaded', async function() {
            await loadPlans();
        });

        async function loadPlans() {
            const loadingEl = document.getElementById('loading');
            const errorEl = document.getElementById('error');
            const gridEl = document.getElementById('plans-grid');

            try {
                const response = await fetch('/api/v1/subscriptions/plans');

                if (!response.ok) {
                    throw new Error('Failed to fetch plans');
                }

                const data = await response.json();
                const plans = data.plans || [];

                // Hide loading, show grid
                loadingEl.style.display = 'none';
                gridEl.style.display = 'grid';

                // Render plans
                gridEl.innerHTML = plans.map((plan, index) => {
                    const isProfessional = plan.name === 'professional';
                    const monthlyPrice = plan.price_monthly;
                    const yearlyPrice = plan.price_yearly;
                    const yearlyMonthly = yearlyPrice ? (yearlyPrice / 12).toFixed(2) : null;

                    return `
                        <div class="plan-card ${isProfessional ? 'popular' : ''}">
                            ${isProfessional ? '<div class="popular-badge">Most Popular</div>' : ''}
                            <div class="plan-name">${plan.display_name}</div>
                            <div class="plan-price">
                                $${monthlyPrice.toFixed(0)}
                                <span>/month</span>
                            </div>
                            ${yearlyPrice ? `
                                <div class="plan-billing">
                                    or $${yearlyPrice.toFixed(0)}/year (save $${(monthlyPrice * 12 - yearlyPrice).toFixed(0)})
                                </div>
                            ` : '<div class="plan-billing">Monthly billing</div>'}

                            <ul class="plan-features">
                                ${plan.features.map(feature => `<li>${feature}</li>`).join('')}
                            </ul>

                            <button class="plan-button ${isProfessional ? 'primary' : ''}" onclick="selectPlan('${plan.name}')">
                                Select ${plan.display_name}
                            </button>
                        </div>
                    `;
                }).join('');

            } catch (error) {
                console.error('Failed to load plans:', error);
                loadingEl.style.display = 'none';
                errorEl.style.display = 'block';
            }
        }

        function selectPlan(planName) {
            // Redirect to signup flow with selected plan
            window.location.href = `/signup-flow.html?plan=${planName}`;
        }
    </script>
</body>
</html>
