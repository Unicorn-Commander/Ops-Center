<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Subscription Management - UC-1 Pro Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/jquery.dataTables.min.css">
    <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #1a0033 0%, #2d1b4e 50%, #1a0033 100%);
            min-height: 100vh;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            box-shadow: 0 8px 32px 0 rgba(138, 43, 226, 0.2);
        }
        .stat-card {
            background: linear-gradient(135deg, rgba(138, 43, 226, 0.2) 0%, rgba(75, 0, 130, 0.2) 100%);
            border: 1px solid rgba(138, 43, 226, 0.3);
        }
        .tier-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
        }
        .tier-free { background: #64748b; color: white; }
        .tier-trial { background: #3b82f6; color: white; }
        .tier-starter { background: #10b981; color: white; }
        .tier-professional { background: #8b5cf6; color: white; }
        .tier-enterprise { background: #f59e0b; color: white; }

        .status-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 0.75rem;
            font-weight: 600;
        }
        .status-active { background: #10b981; color: white; }
        .status-cancelled { background: #ef4444; color: white; }
        .status-suspended { background: #f59e0b; color: white; }
        .status-trial { background: #3b82f6; color: white; }

        .dataTables_wrapper {
            color: white;
        }
        .dataTables_wrapper .dataTables_filter input {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            padding: 8px 12px;
            border-radius: 8px;
        }
        .dataTables_wrapper .dataTables_length select {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            padding: 4px 8px;
            border-radius: 8px;
        }
        table.dataTable {
            color: white;
            border-collapse: separate;
            border-spacing: 0 8px;
        }
        table.dataTable thead th {
            background: rgba(138, 43, 226, 0.3);
            border: none;
            padding: 12px;
        }
        table.dataTable tbody tr {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        table.dataTable tbody tr:hover {
            background: rgba(138, 43, 226, 0.2);
        }
        table.dataTable tbody td {
            border: none;
            padding: 12px;
        }
        .action-btn {
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 0.875rem;
            cursor: pointer;
            transition: all 0.2s;
        }
        .action-btn:hover {
            transform: translateY(-2px);
        }
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.8);
        }
        .modal-content {
            background: linear-gradient(135deg, #2d1b4e 0%, #1a0033 100%);
            margin: 5% auto;
            padding: 30px;
            border: 2px solid rgba(138, 43, 226, 0.5);
            border-radius: 16px;
            width: 90%;
            max-width: 600px;
        }
        .close {
            color: #aaa;
            float: right;
            font-size: 28px;
            font-weight: bold;
            cursor: pointer;
        }
        .close:hover {
            color: white;
        }
    </style>
</head>
<body class="text-white">

    <!-- Header -->
    <div class="container mx-auto px-4 py-6">
        <div class="flex justify-between items-center mb-6">
            <div>
                <h1 class="text-3xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-purple-400 to-pink-400">
                    <i class="fas fa-crown mr-2"></i>Subscription Management
                </h1>
                <p class="text-gray-400 mt-2">Manage user subscriptions and billing</p>
            </div>
            <div class="flex gap-4">
                <button onclick="refreshData()" class="px-4 py-2 bg-purple-600 hover:bg-purple-700 rounded-lg transition">
                    <i class="fas fa-sync-alt mr-2"></i>Refresh
                </button>
                <a href="/dashboard.html" class="px-4 py-2 bg-gray-700 hover:bg-gray-600 rounded-lg transition">
                    <i class="fas fa-arrow-left mr-2"></i>Back to Dashboard
                </a>
            </div>
        </div>

        <!-- Analytics Cards -->
        <div id="analytics-section" class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-6">
            <!-- Cards will be populated by JavaScript -->
        </div>

        <!-- Subscription Table -->
        <div class="glass-card p-6">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-2xl font-bold">
                    <i class="fas fa-users mr-2"></i>All Subscriptions
                </h2>
                <div class="flex gap-2">
                    <button onclick="exportCSV()" class="px-4 py-2 bg-green-600 hover:bg-green-700 rounded-lg transition">
                        <i class="fas fa-file-csv mr-2"></i>Export CSV
                    </button>
                </div>
            </div>

            <table id="subscriptions-table" class="display" style="width:100%">
                <thead>
                    <tr>
                        <th>Email</th>
                        <th>Username</th>
                        <th>Tier</th>
                        <th>Status</th>
                        <th>Usage</th>
                        <th>BYOK</th>
                        <th>Last Login</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="subscriptions-body">
                    <!-- Populated by JavaScript -->
                </tbody>
            </table>
        </div>
    </div>

    <!-- Edit Subscription Modal -->
    <div id="edit-modal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeEditModal()">&times;</span>
            <h2 class="text-2xl font-bold mb-4">
                <i class="fas fa-edit mr-2"></i>Edit Subscription
            </h2>

            <form id="edit-form" class="space-y-4">
                <input type="hidden" id="edit-email">

                <div>
                    <label class="block text-sm font-medium mb-2">Email</label>
                    <input type="text" id="edit-email-display" disabled class="w-full px-4 py-2 bg-gray-800 border border-gray-700 rounded-lg">
                </div>

                <div>
                    <label class="block text-sm font-medium mb-2">Subscription Tier</label>
                    <select id="edit-tier" class="w-full px-4 py-2 bg-gray-800 border border-gray-700 rounded-lg text-white">
                        <option value="free">Free</option>
                        <option value="trial">Trial</option>
                        <option value="starter">Starter - $19/mo</option>
                        <option value="professional">Professional - $49/mo</option>
                        <option value="enterprise">Enterprise - $99/mo</option>
                    </select>
                </div>

                <div>
                    <label class="block text-sm font-medium mb-2">Status</label>
                    <select id="edit-status" class="w-full px-4 py-2 bg-gray-800 border border-gray-700 rounded-lg text-white">
                        <option value="active">Active</option>
                        <option value="trial">Trial</option>
                        <option value="cancelled">Cancelled</option>
                        <option value="suspended">Suspended</option>
                    </select>
                </div>

                <div>
                    <label class="block text-sm font-medium mb-2">Admin Notes</label>
                    <textarea id="edit-notes" rows="3" class="w-full px-4 py-2 bg-gray-800 border border-gray-700 rounded-lg text-white"></textarea>
                </div>

                <div class="flex gap-4">
                    <button type="submit" class="flex-1 px-4 py-2 bg-purple-600 hover:bg-purple-700 rounded-lg transition">
                        <i class="fas fa-save mr-2"></i>Save Changes
                    </button>
                    <button type="button" onclick="closeEditModal()" class="flex-1 px-4 py-2 bg-gray-700 hover:bg-gray-600 rounded-lg transition">
                        Cancel
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- View Details Modal -->
    <div id="details-modal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeDetailsModal()">&times;</span>
            <h2 class="text-2xl font-bold mb-4">
                <i class="fas fa-info-circle mr-2"></i>Subscription Details
            </h2>
            <div id="details-content" class="space-y-4">
                <!-- Populated by JavaScript -->
            </div>
        </div>
    </div>

    <script>
        let subscriptionsTable;
        let allSubscriptions = [];

        // Initialize on page load
        $(document).ready(function() {
            checkAdminAccess();
            loadAnalytics();
            loadSubscriptions();
        });

        async function checkAdminAccess() {
            try {
                const response = await fetch('/api/v1/auth/me');
                if (!response.ok) {
                    window.location.href = '/login.html';
                    return;
                }
                const user = await response.json();
                const isAdmin = user.role === 'admin' || user.is_admin || user.is_superuser;
                if (!isAdmin) {
                    alert('Admin access required');
                    window.location.href = '/dashboard.html';
                }
            } catch (error) {
                console.error('Error checking admin access:', error);
                window.location.href = '/login.html';
            }
        }

        async function loadAnalytics() {
            try {
                const response = await fetch('/api/v1/admin/subscriptions/analytics/overview');
                const data = await response.json();

                if (data.success) {
                    const analytics = data.analytics;
                    const analyticsHTML = `
                        <div class="glass-card stat-card p-6">
                            <div class="flex items-center justify-between">
                                <div>
                                    <p class="text-gray-400 text-sm">Total Users</p>
                                    <p class="text-3xl font-bold">${analytics.total_users}</p>
                                </div>
                                <i class="fas fa-users text-4xl text-purple-400"></i>
                            </div>
                        </div>

                        <div class="glass-card stat-card p-6">
                            <div class="flex items-center justify-between">
                                <div>
                                    <p class="text-gray-400 text-sm">Active Subscriptions</p>
                                    <p class="text-3xl font-bold">${analytics.active_subscriptions}</p>
                                </div>
                                <i class="fas fa-check-circle text-4xl text-green-400"></i>
                            </div>
                        </div>

                        <div class="glass-card stat-card p-6">
                            <div class="flex items-center justify-between">
                                <div>
                                    <p class="text-gray-400 text-sm">MRR</p>
                                    <p class="text-3xl font-bold">$${analytics.revenue.monthly_recurring_revenue}</p>
                                </div>
                                <i class="fas fa-dollar-sign text-4xl text-yellow-400"></i>
                            </div>
                        </div>

                        <div class="glass-card stat-card p-6">
                            <div class="flex items-center justify-between">
                                <div>
                                    <p class="text-gray-400 text-sm">Total API Calls</p>
                                    <p class="text-3xl font-bold">${analytics.usage.total_api_calls.toLocaleString()}</p>
                                </div>
                                <i class="fas fa-chart-line text-4xl text-blue-400"></i>
                            </div>
                        </div>
                    `;

                    document.getElementById('analytics-section').innerHTML = analyticsHTML;
                }
            } catch (error) {
                console.error('Error loading analytics:', error);
            }
        }

        async function loadSubscriptions() {
            try {
                const response = await fetch('/api/v1/admin/subscriptions/list');
                const data = await response.json();

                if (data.success) {
                    allSubscriptions = data.subscriptions;
                    renderSubscriptionsTable();
                }
            } catch (error) {
                console.error('Error loading subscriptions:', error);
                alert('Failed to load subscriptions: ' + error.message);
            }
        }

        function renderSubscriptionsTable() {
            const tbody = document.getElementById('subscriptions-body');
            tbody.innerHTML = '';

            allSubscriptions.forEach(sub => {
                const usagePercent = sub.limit > 0 ? ((sub.usage / sub.limit) * 100).toFixed(1) : 0;
                const lastLogin = sub.last_login ? new Date(sub.last_login).toLocaleDateString() : 'Never';

                const row = `
                    <tr>
                        <td>${sub.email}</td>
                        <td>${sub.username}</td>
                        <td><span class="tier-badge tier-${sub.tier}">${sub.tier}</span></td>
                        <td><span class="status-badge status-${sub.status}">${sub.status}</span></td>
                        <td>
                            <div class="flex items-center gap-2">
                                <span>${sub.usage.toLocaleString()} / ${sub.limit.toLocaleString()}</span>
                                <div class="w-20 h-2 bg-gray-700 rounded-full overflow-hidden">
                                    <div class="h-full bg-purple-500" style="width: ${Math.min(usagePercent, 100)}%"></div>
                                </div>
                            </div>
                        </td>
                        <td>
                            ${sub.byok_providers && sub.byok_providers.length > 0 ?
                                `<span class="text-green-400"><i class="fas fa-check"></i> ${sub.byok_providers.length}</span>` :
                                `<span class="text-gray-500"><i class="fas fa-times"></i></span>`
                            }
                        </td>
                        <td>${lastLogin}</td>
                        <td>
                            <div class="flex gap-2">
                                <button onclick="viewDetails('${sub.email}')" class="action-btn bg-blue-600 hover:bg-blue-700" title="View Details">
                                    <i class="fas fa-eye"></i>
                                </button>
                                <button onclick="editSubscription('${sub.email}')" class="action-btn bg-purple-600 hover:bg-purple-700" title="Edit">
                                    <i class="fas fa-edit"></i>
                                </button>
                                <button onclick="resetUsage('${sub.email}')" class="action-btn bg-green-600 hover:bg-green-700" title="Reset Usage">
                                    <i class="fas fa-redo"></i>
                                </button>
                            </div>
                        </td>
                    </tr>
                `;
                tbody.innerHTML += row;
            });

            // Initialize or refresh DataTable
            if (subscriptionsTable) {
                subscriptionsTable.destroy();
            }

            subscriptionsTable = $('#subscriptions-table').DataTable({
                pageLength: 25,
                order: [[0, 'asc']],
                language: {
                    search: "Search subscriptions:"
                }
            });
        }

        async function viewDetails(email) {
            try {
                const response = await fetch(`/api/v1/admin/subscriptions/${encodeURIComponent(email)}`);
                const data = await response.json();

                if (data.success) {
                    const user = data.user;
                    const detailsHTML = `
                        <div class="grid grid-cols-2 gap-4">
                            <div>
                                <p class="text-gray-400 text-sm">Email</p>
                                <p class="font-medium">${user.email}</p>
                            </div>
                            <div>
                                <p class="text-gray-400 text-sm">Username</p>
                                <p class="font-medium">${user.username}</p>
                            </div>
                            <div>
                                <p class="text-gray-400 text-sm">Subscription Tier</p>
                                <p class="font-medium"><span class="tier-badge tier-${user.tier}">${user.tier}</span></p>
                            </div>
                            <div>
                                <p class="text-gray-400 text-sm">Status</p>
                                <p class="font-medium"><span class="status-badge status-${user.status}">${user.status}</span></p>
                            </div>
                            <div>
                                <p class="text-gray-400 text-sm">API Calls Used</p>
                                <p class="font-medium">${user.usage.api_calls_used.toLocaleString()} / ${user.usage.api_calls_limit.toLocaleString()}</p>
                            </div>
                            <div>
                                <p class="text-gray-400 text-sm">BYOK Providers</p>
                                <p class="font-medium">${user.byok_keys.length > 0 ? user.byok_keys.join(', ') : 'None'}</p>
                            </div>
                            <div>
                                <p class="text-gray-400 text-sm">Joined Date</p>
                                <p class="font-medium">${user.joined_date ? new Date(user.joined_date).toLocaleDateString() : 'N/A'}</p>
                            </div>
                            <div>
                                <p class="text-gray-400 text-sm">Last Login</p>
                                <p class="font-medium">${user.last_login ? new Date(user.last_login).toLocaleDateString() : 'Never'}</p>
                            </div>
                        </div>
                    `;

                    document.getElementById('details-content').innerHTML = detailsHTML;
                    document.getElementById('details-modal').style.display = 'block';
                }
            } catch (error) {
                console.error('Error loading details:', error);
                alert('Failed to load user details');
            }
        }

        function editSubscription(email) {
            const sub = allSubscriptions.find(s => s.email === email);
            if (!sub) return;

            document.getElementById('edit-email').value = email;
            document.getElementById('edit-email-display').value = email;
            document.getElementById('edit-tier').value = sub.tier;
            document.getElementById('edit-status').value = sub.status;
            document.getElementById('edit-notes').value = '';

            document.getElementById('edit-modal').style.display = 'block';
        }

        document.getElementById('edit-form').addEventListener('submit', async (e) => {
            e.preventDefault();

            const email = document.getElementById('edit-email').value;
            const tier = document.getElementById('edit-tier').value;
            const status = document.getElementById('edit-status').value;
            const notes = document.getElementById('edit-notes').value;

            try {
                const response = await fetch(`/api/v1/admin/subscriptions/${encodeURIComponent(email)}`, {
                    method: 'PATCH',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ tier, status, notes })
                });

                const data = await response.json();

                if (data.success) {
                    alert('Subscription updated successfully');
                    closeEditModal();
                    refreshData();
                } else {
                    alert('Failed to update subscription: ' + (data.detail || 'Unknown error'));
                }
            } catch (error) {
                console.error('Error updating subscription:', error);
                alert('Failed to update subscription');
            }
        });

        async function resetUsage(email) {
            if (!confirm(`Reset API usage for ${email}?`)) return;

            try {
                const response = await fetch(`/api/v1/admin/subscriptions/${encodeURIComponent(email)}/reset-usage`, {
                    method: 'POST'
                });

                const data = await response.json();

                if (data.success) {
                    alert('Usage reset successfully');
                    refreshData();
                } else {
                    alert('Failed to reset usage');
                }
            } catch (error) {
                console.error('Error resetting usage:', error);
                alert('Failed to reset usage');
            }
        }

        function closeEditModal() {
            document.getElementById('edit-modal').style.display = 'none';
        }

        function closeDetailsModal() {
            document.getElementById('details-modal').style.display = 'none';
        }

        function refreshData() {
            loadAnalytics();
            loadSubscriptions();
        }

        function exportCSV() {
            const headers = ['Email', 'Username', 'Tier', 'Status', 'Usage', 'Limit', 'Last Login'];
            const rows = allSubscriptions.map(sub => [
                sub.email,
                sub.username,
                sub.tier,
                sub.status,
                sub.usage,
                sub.limit,
                sub.last_login || 'Never'
            ]);

            let csv = headers.join(',') + '\n';
            rows.forEach(row => {
                csv += row.map(cell => `"${cell}"`).join(',') + '\n';
            });

            const blob = new Blob([csv], { type: 'text/csv' });
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `subscriptions-${new Date().toISOString().split('T')[0]}.csv`;
            a.click();
        }

        // Close modals when clicking outside
        window.onclick = function(event) {
            if (event.target.classList.contains('modal')) {
                event.target.style.display = 'none';
            }
        }
    </script>

</body>
</html>
