<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UC-1 Pro - AI Command Center</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <style id="dynamic-theme">
        /* Default styles - will be replaced by dynamic configuration */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
    </style>
</head>
<body>
    <div id="app">
        <div class="loading-overlay">
            <div class="loading-content">
                <div class="ai-loader">
                    <div class="ai-loader-dot"></div>
                    <div class="ai-loader-dot"></div>
                    <div class="ai-loader-dot"></div>
                </div>
                <p>Initializing AI Systems...</p>
            </div>
        </div>
    </div>
    
    <script>
        // Global configuration
        let landingConfig = null;
        let servicesStatus = {};
        let userTheme = localStorage.getItem('userTheme') || null;
        
        // Check deployment type
        const IS_SUBDOMAIN = window.location.hostname.includes('.magicunicorn.tech');
        const BASE_URL = IS_SUBDOMAIN ? '' : ':8084';
        
        // Theme definitions
        const THEMES = {
            dark: {
                name: 'Dark',
                background: 'linear-gradient(135deg, #0f172a 0%, #1e293b 100%)',
                cardBg: 'rgba(30, 41, 59, 0.95)',
                cardBorder: 'rgba(71, 85, 105, 0.3)',
                text: '#f1f5f9',
                textMuted: '#94a3b8',
                primary: '#3b82f6',
                secondary: '#8b5cf6',
                accent: '#f59e0b',
                searchBg: 'rgba(30, 41, 59, 0.8)',
                searchBorder: 'rgba(71, 85, 105, 0.5)',
                glow: 'rgba(59, 130, 246, 0.5)'
            },
            light: {
                name: 'Light',
                background: 'linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%)',
                cardBg: 'rgba(255, 255, 255, 0.95)',
                cardBorder: 'rgba(203, 213, 225, 0.5)',
                text: '#0f172a',
                textMuted: '#64748b',
                primary: '#3b82f6',
                secondary: '#8b5cf6',
                accent: '#f59e0b',
                searchBg: 'rgba(255, 255, 255, 0.9)',
                searchBorder: 'rgba(203, 213, 225, 0.8)',
                glow: 'rgba(59, 130, 246, 0.3)'
            },
            unicorn: {
                name: 'Magic Unicorn',
                background: 'linear-gradient(135deg, #8b5cf6 0%, #ec4899 50%, #f59e0b 100%)',
                cardBg: 'rgba(255, 255, 255, 0.95)',
                cardBorder: 'rgba(139, 92, 246, 0.2)',
                text: '#1f2937',
                textMuted: '#6b7280',
                primary: '#8b5cf6',
                secondary: '#ec4899',
                accent: '#f59e0b',
                searchBg: 'rgba(255, 255, 255, 0.95)',
                searchBorder: 'rgba(139, 92, 246, 0.3)',
                glow: 'rgba(139, 92, 246, 0.5)'
            }
        };
        
        // Apply theme styles
        function applyTheme(themeName) {
            const theme = THEMES[themeName] || THEMES.dark;
            const config = landingConfig || { animations: { enabled: true } };
            
            const css = `
                * {
                    margin: 0;
                    padding: 0;
                    box-sizing: border-box;
                }
                
                :root {
                    --bg: ${theme.background};
                    --card-bg: ${theme.cardBg};
                    --card-border: ${theme.cardBorder};
                    --text: ${theme.text};
                    --text-muted: ${theme.textMuted};
                    --primary: ${theme.primary};
                    --secondary: ${theme.secondary};
                    --accent: ${theme.accent};
                    --search-bg: ${theme.searchBg};
                    --search-border: ${theme.searchBorder};
                    --glow: ${theme.glow};
                }
                
                body {
                    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
                    background: var(--bg);
                    color: var(--text);
                    min-height: 100vh;
                    display: flex;
                    flex-direction: column;
                    transition: all 0.3s ease;
                    background-size: 400% 400%;
                    ${themeName === 'unicorn' ? 'animation: gradientShift 15s ease infinite;' : ''}
                }
                
                @keyframes gradientShift {
                    0%, 100% { background-position: 0% 50%; }
                    50% { background-position: 100% 50%; }
                }
                
                /* Header */
                .header {
                    background: var(--card-bg);
                    backdrop-filter: blur(20px);
                    border-bottom: 1px solid var(--card-border);
                    padding: 1rem 2rem;
                    position: sticky;
                    top: 0;
                    z-index: 100;
                    transition: all 0.3s ease;
                }
                
                .header-content {
                    max-width: 1400px;
                    margin: 0 auto;
                    display: flex;
                    justify-content: space-between;
                    align-items: center;
                    gap: 2rem;
                }
                
                .logo-section {
                    display: flex;
                    align-items: center;
                    gap: 1rem;
                    min-width: 250px;
                }
                
                .logo {
                    width: 48px;
                    height: 48px;
                    border-radius: 12px;
                    overflow: hidden;
                    box-shadow: 0 0 20px var(--glow);
                    transition: transform 0.3s ease;
                }
                
                .logo:hover {
                    transform: scale(1.05) rotate(3deg);
                }
                
                .logo img {
                    width: 100%;
                    height: 100%;
                    object-fit: cover;
                }
                
                .brand h1 {
                    font-size: 1.25rem;
                    font-weight: 700;
                    background: linear-gradient(135deg, var(--primary), var(--secondary));
                    -webkit-background-clip: text;
                    -webkit-text-fill-color: transparent;
                    background-clip: text;
                }
                
                .brand .subtitle {
                    font-size: 0.75rem;
                    color: var(--text-muted);
                    font-weight: 500;
                    text-transform: uppercase;
                    letter-spacing: 0.5px;
                }
                
                /* Search Section */
                .search-container {
                    flex: 1;
                    max-width: 600px;
                    position: relative;
                }
                
                .search-wrapper {
                    position: relative;
                    width: 100%;
                }
                
                .search-input {
                    width: 100%;
                    padding: 0.875rem 3.5rem 0.875rem 3rem;
                    background: var(--search-bg);
                    border: 2px solid var(--search-border);
                    border-radius: 50px;
                    font-size: 1rem;
                    color: var(--text);
                    transition: all 0.3s ease;
                    backdrop-filter: blur(10px);
                }
                
                .search-input:focus {
                    outline: none;
                    border-color: var(--primary);
                    box-shadow: 0 0 0 4px var(--glow), 0 10px 40px -10px var(--glow);
                    transform: translateY(-1px);
                }
                
                .search-input::placeholder {
                    color: var(--text-muted);
                }
                
                .search-icon {
                    position: absolute;
                    left: 1rem;
                    top: 50%;
                    transform: translateY(-50%);
                    color: var(--text-muted);
                    pointer-events: none;
                    transition: color 0.3s ease;
                }
                
                .search-input:focus ~ .search-icon {
                    color: var(--primary);
                }
                
                .search-submit {
                    position: absolute;
                    right: 0.5rem;
                    top: 50%;
                    transform: translateY(-50%);
                    padding: 0.5rem 1.25rem;
                    background: linear-gradient(135deg, var(--primary), var(--secondary));
                    color: white;
                    border: none;
                    border-radius: 50px;
                    font-weight: 600;
                    cursor: pointer;
                    transition: all 0.3s ease;
                    font-size: 0.9rem;
                }
                
                .search-submit:hover {
                    transform: translateY(-50%) scale(1.05);
                    box-shadow: 0 5px 20px -5px var(--glow);
                }
                
                .search-hint {
                    position: absolute;
                    top: 100%;
                    left: 1.5rem;
                    margin-top: 0.5rem;
                    font-size: 0.75rem;
                    color: var(--text-muted);
                    opacity: 0.7;
                }
                
                /* User Menu */
                .user-menu {
                    display: flex;
                    align-items: center;
                    gap: 1rem;
                }
                
                .theme-switcher {
                    display: flex;
                    gap: 0.5rem;
                    padding: 0.25rem;
                    background: var(--search-bg);
                    border-radius: 50px;
                    border: 1px solid var(--card-border);
                }
                
                .theme-btn {
                    padding: 0.5rem 0.75rem;
                    background: transparent;
                    border: none;
                    border-radius: 50px;
                    color: var(--text-muted);
                    cursor: pointer;
                    transition: all 0.3s ease;
                    font-size: 1.2rem;
                }
                
                .theme-btn.active {
                    background: linear-gradient(135deg, var(--primary), var(--secondary));
                    color: white;
                    box-shadow: 0 2px 10px -2px var(--glow);
                }
                
                .theme-btn:hover:not(.active) {
                    color: var(--text);
                    background: var(--card-bg);
                }
                
                .user-info {
                    display: flex;
                    align-items: center;
                    gap: 0.75rem;
                    padding: 0.5rem 1rem;
                    background: var(--search-bg);
                    border-radius: 50px;
                    border: 1px solid var(--card-border);
                }
                
                .user-avatar {
                    width: 32px;
                    height: 32px;
                    background: linear-gradient(135deg, var(--primary), var(--secondary));
                    border-radius: 50%;
                    display: flex;
                    align-items: center;
                    justify-content: center;
                    color: white;
                    font-weight: 600;
                    font-size: 0.9rem;
                }
                
                .logout-btn {
                    padding: 0.5rem 1rem;
                    background: linear-gradient(135deg, #ef4444, #dc2626);
                    color: white;
                    border: none;
                    border-radius: 50px;
                    cursor: pointer;
                    font-weight: 600;
                    transition: all 0.3s ease;
                    font-size: 0.9rem;
                }
                
                .logout-btn:hover {
                    transform: scale(1.05);
                    box-shadow: 0 5px 20px -5px rgba(239, 68, 68, 0.5);
                }
                
                /* Main Container */
                .container {
                    flex: 1;
                    padding: 2rem;
                    max-width: 1400px;
                    width: 100%;
                    margin: 0 auto;
                }
                
                /* Stats Bar */
                .stats-bar {
                    display: grid;
                    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
                    gap: 1rem;
                    margin-bottom: 2rem;
                }
                
                .stat-card {
                    background: var(--card-bg);
                    backdrop-filter: blur(20px);
                    border: 1px solid var(--card-border);
                    border-radius: 16px;
                    padding: 1.25rem;
                    display: flex;
                    align-items: center;
                    gap: 1rem;
                    transition: all 0.3s ease;
                }
                
                .stat-card:hover {
                    transform: translateY(-2px);
                    box-shadow: 0 10px 40px -10px var(--glow);
                    border-color: var(--primary);
                }
                
                .stat-icon {
                    width: 48px;
                    height: 48px;
                    background: linear-gradient(135deg, var(--primary), var(--secondary));
                    border-radius: 12px;
                    display: flex;
                    align-items: center;
                    justify-content: center;
                    color: white;
                    font-size: 1.5rem;
                }
                
                .stat-content h3 {
                    font-size: 0.75rem;
                    text-transform: uppercase;
                    color: var(--text-muted);
                    margin-bottom: 0.25rem;
                    letter-spacing: 0.5px;
                }
                
                .stat-content .value {
                    font-size: 1.5rem;
                    font-weight: 700;
                    color: var(--text);
                }
                
                /* Service Grid */
                .services-section {
                    margin-bottom: 2rem;
                }
                
                .section-header {
                    display: flex;
                    align-items: center;
                    justify-content: space-between;
                    margin-bottom: 1.5rem;
                }
                
                .section-title {
                    font-size: 1.25rem;
                    font-weight: 700;
                    color: var(--text);
                    display: flex;
                    align-items: center;
                    gap: 0.5rem;
                }
                
                .section-title .badge {
                    padding: 0.25rem 0.75rem;
                    background: linear-gradient(135deg, var(--primary), var(--secondary));
                    color: white;
                    border-radius: 50px;
                    font-size: 0.75rem;
                    font-weight: 600;
                }
                
                .service-grid {
                    display: grid;
                    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
                    gap: 1.25rem;
                }
                
                .service-card {
                    background: var(--card-bg);
                    backdrop-filter: blur(20px);
                    border: 1px solid var(--card-border);
                    border-radius: 20px;
                    padding: 1.5rem;
                    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
                    cursor: pointer;
                    position: relative;
                    overflow: hidden;
                }
                
                .service-card::before {
                    content: '';
                    position: absolute;
                    top: 0;
                    left: 0;
                    right: 0;
                    height: 2px;
                    background: linear-gradient(90deg, var(--primary), var(--secondary), var(--accent));
                    transform: translateX(-100%);
                    transition: transform 0.3s ease;
                }
                
                .service-card:hover::before {
                    transform: translateX(0);
                }
                
                .service-card:hover {
                    transform: translateY(-4px) scale(1.02);
                    box-shadow: 0 20px 60px -15px var(--glow);
                    border-color: var(--primary);
                }
                
                .service-header {
                    display: flex;
                    align-items: flex-start;
                    gap: 1rem;
                    margin-bottom: 1rem;
                }
                
                .service-logo {
                    width: 48px;
                    height: 48px;
                    border-radius: 12px;
                    overflow: hidden;
                    box-shadow: 0 4px 12px -2px rgba(0,0,0,0.1);
                    flex-shrink: 0;
                }
                
                .service-logo img {
                    width: 100%;
                    height: 100%;
                    object-fit: cover;
                }
                
                .service-icon {
                    width: 48px;
                    height: 48px;
                    background: linear-gradient(135deg, var(--primary), var(--secondary));
                    border-radius: 12px;
                    display: flex;
                    align-items: center;
                    justify-content: center;
                    color: white;
                    font-size: 1.5rem;
                    flex-shrink: 0;
                }
                
                .service-meta {
                    flex: 1;
                    display: flex;
                    flex-direction: column;
                    gap: 0.25rem;
                }
                
                .service-name {
                    font-weight: 600;
                    font-size: 1rem;
                    color: var(--text);
                }
                
                .service-status {
                    display: inline-flex;
                    align-items: center;
                    gap: 0.25rem;
                    padding: 0.125rem 0.5rem;
                    background: rgba(16, 185, 129, 0.1);
                    color: #10b981;
                    border-radius: 50px;
                    font-size: 0.7rem;
                    font-weight: 600;
                    text-transform: uppercase;
                    width: fit-content;
                }
                
                .service-status.offline {
                    background: rgba(239, 68, 68, 0.1);
                    color: #ef4444;
                }
                
                .service-status::before {
                    content: '';
                    width: 6px;
                    height: 6px;
                    background: currentColor;
                    border-radius: 50%;
                    animation: pulse 2s infinite;
                }
                
                @keyframes pulse {
                    0%, 100% { opacity: 1; }
                    50% { opacity: 0.5; }
                }
                
                .service-description {
                    color: var(--text-muted);
                    font-size: 0.875rem;
                    line-height: 1.5;
                    margin-bottom: 1rem;
                }
                
                .service-action {
                    display: inline-flex;
                    align-items: center;
                    gap: 0.5rem;
                    padding: 0.625rem 1.25rem;
                    background: linear-gradient(135deg, var(--primary), var(--secondary));
                    color: white;
                    text-decoration: none;
                    border-radius: 50px;
                    font-weight: 600;
                    font-size: 0.875rem;
                    transition: all 0.3s ease;
                    width: 100%;
                    justify-content: center;
                }
                
                .service-action:hover {
                    transform: scale(1.02);
                    box-shadow: 0 10px 30px -10px var(--glow);
                }
                
                .service-action::after {
                    content: '→';
                    transition: transform 0.3s ease;
                }
                
                .service-action:hover::after {
                    transform: translateX(3px);
                }
                
                /* Admin Section */
                .admin-section {
                    background: linear-gradient(135deg, var(--accent), var(--primary));
                    border-radius: 24px;
                    padding: 2rem;
                    text-align: center;
                    position: relative;
                    overflow: hidden;
                    color: white;
                    margin-top: 2rem;
                }
                
                .admin-section::before {
                    content: '';
                    position: absolute;
                    top: -50%;
                    right: -50%;
                    width: 200%;
                    height: 200%;
                    background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, transparent 70%);
                    animation: rotate 30s linear infinite;
                }
                
                @keyframes rotate {
                    0% { transform: rotate(0deg); }
                    100% { transform: rotate(360deg); }
                }
                
                .admin-content {
                    position: relative;
                    z-index: 1;
                }
                
                .admin-section h3 {
                    font-size: 1.5rem;
                    margin-bottom: 0.5rem;
                }
                
                .admin-section p {
                    opacity: 0.9;
                    margin-bottom: 1.5rem;
                }
                
                .admin-btn {
                    display: inline-flex;
                    align-items: center;
                    gap: 0.75rem;
                    padding: 0.875rem 2rem;
                    background: rgba(255, 255, 255, 0.2);
                    backdrop-filter: blur(10px);
                    color: white;
                    text-decoration: none;
                    border-radius: 50px;
                    font-weight: 700;
                    font-size: 1rem;
                    transition: all 0.3s ease;
                    border: 2px solid rgba(255, 255, 255, 0.3);
                }
                
                .admin-btn:hover {
                    background: rgba(255, 255, 255, 0.3);
                    transform: scale(1.05);
                    box-shadow: 0 20px 40px -10px rgba(0,0,0,0.3);
                }
                
                /* Loading State */
                .loading-overlay {
                    position: fixed;
                    top: 0;
                    left: 0;
                    right: 0;
                    bottom: 0;
                    background: var(--bg);
                    display: flex;
                    align-items: center;
                    justify-content: center;
                    z-index: 1000;
                }
                
                .loading-content {
                    text-align: center;
                }
                
                .ai-loader {
                    display: flex;
                    gap: 0.5rem;
                    justify-content: center;
                    margin-bottom: 1rem;
                }
                
                .ai-loader-dot {
                    width: 12px;
                    height: 12px;
                    background: linear-gradient(135deg, var(--primary), var(--secondary));
                    border-radius: 50%;
                    animation: bounce 1.4s infinite ease-in-out both;
                }
                
                .ai-loader-dot:nth-child(1) { animation-delay: -0.32s; }
                .ai-loader-dot:nth-child(2) { animation-delay: -0.16s; }
                
                @keyframes bounce {
                    0%, 80%, 100% {
                        transform: scale(0.8);
                        opacity: 0.5;
                    }
                    40% {
                        transform: scale(1.2);
                        opacity: 1;
                    }
                }
                
                .loading-content p {
                    color: var(--text-muted);
                    font-weight: 500;
                }
                
                /* Responsive */
                @media (max-width: 768px) {
                    .header-content {
                        flex-direction: column;
                        gap: 1rem;
                    }
                    
                    .search-container {
                        width: 100%;
                    }
                    
                    .user-menu {
                        width: 100%;
                        justify-content: space-between;
                    }
                    
                    .stats-bar {
                        grid-template-columns: 1fr;
                    }
                    
                    .service-grid {
                        grid-template-columns: 1fr;
                    }
                }
            `;
            
            document.getElementById('dynamic-theme').innerHTML = css;
            localStorage.setItem('userTheme', themeName);
        }
        
        // Handle search
        function handleSearch(event) {
            event.preventDefault();
            const searchInput = document.getElementById('searchInput');
            const query = searchInput.value.trim();
            
            if (query) {
                // Determine Center-Deep URL
                let searchUrl;
                if (IS_SUBDOMAIN) {
                    searchUrl = `https://search.yoda.unicorncommander.ai/search?q=${encodeURIComponent(query)}`;
                } else {
                    searchUrl = `http://${window.location.hostname}:8888/search?q=${encodeURIComponent(query)}`;
                }
                
                // Open in new tab
                window.open(searchUrl, '_blank');
            }
        }
        
        // Render the page
        function renderLandingPage(config) {
            const branding = config.branding;
            const services = [...config.services, ...config.custom_links]
                .filter(s => s.enabled)
                .sort((a, b) => a.order - b.order);
            const adminSection = config.admin_section;
            
            // Calculate stats
            const totalServices = services.length;
            const onlineServices = services.filter(s => servicesStatus[s.id]).length;
            const apiServices = services.filter(s => s.apiOnly).length;
            
            let html = `
                <div class="header">
                    <div class="header-content">
                        <div class="logo-section">
                            ${branding.logo_url ? 
                                `<div class="logo">
                                    <img src="${branding.logo_url}" alt="${branding.company_name}">
                                </div>` :
                                `<div class="logo">🚀</div>`
                            }
                            <div class="brand">
                                <h1>${branding.company_name}</h1>
                                <div class="subtitle">${branding.company_subtitle}</div>
                            </div>
                        </div>
                        
                        <div class="search-container">
                            <form onsubmit="handleSearch(event)" class="search-wrapper">
                                <svg class="search-icon" width="20" height="20" viewBox="0 0 20 20" fill="currentColor">
                                    <path fill-rule="evenodd" d="M8 4a4 4 0 100 8 4 4 0 000-8zM2 8a6 6 0 1110.89 3.476l4.817 4.817a1 1 0 01-1.414 1.414l-4.816-4.816A6 6 0 012 8z" clip-rule="evenodd" />
                                </svg>
                                <input 
                                    type="text" 
                                    id="searchInput"
                                    class="search-input" 
                                    placeholder="Search with Center-Deep AI..."
                                    autocomplete="off"
                                    autofocus
                                >
                                <button type="submit" class="search-submit">Search</button>
                                <div class="search-hint">Press Enter to search or click the button</div>
                            </form>
                        </div>
                        
                        <div class="user-menu">
                            <div class="theme-switcher">
                                <button class="theme-btn ${userTheme === 'dark' || (!userTheme && config.theme.preset === 'dashboard') ? 'active' : ''}" 
                                        onclick="applyTheme('dark')" title="Dark Theme">🌙</button>
                                <button class="theme-btn ${userTheme === 'light' ? 'active' : ''}" 
                                        onclick="applyTheme('light')" title="Light Theme">☀️</button>
                                <button class="theme-btn ${userTheme === 'unicorn' || (!userTheme && config.theme.preset === 'magic-unicorn') ? 'active' : ''}" 
                                        onclick="applyTheme('unicorn')" title="Magic Unicorn">🦄</button>
                            </div>
                            
                            <div class="user-info">
                                <div class="user-avatar" id="userAvatar">U</div>
                                <span id="userName">Loading...</span>
                            </div>
                            
                            <button class="logout-btn" onclick="logout()">Logout</button>
                        </div>
                    </div>
                </div>
                
                <div class="container">
                    <!-- Stats Bar -->
                    <div class="stats-bar">
                        <div class="stat-card">
                            <div class="stat-icon">⚡</div>
                            <div class="stat-content">
                                <h3>Active Services</h3>
                                <div class="value">${onlineServices}/${totalServices}</div>
                            </div>
                        </div>
                        
                        <div class="stat-card">
                            <div class="stat-icon">🤖</div>
                            <div class="stat-content">
                                <h3>AI Models</h3>
                                <div class="value">32B</div>
                            </div>
                        </div>
                        
                        <div class="stat-card">
                            <div class="stat-icon">🔌</div>
                            <div class="stat-content">
                                <h3>API Endpoints</h3>
                                <div class="value">${apiServices}</div>
                            </div>
                        </div>
                        
                        <div class="stat-card">
                            <div class="stat-icon">🚀</div>
                            <div class="stat-content">
                                <h3>GPU Status</h3>
                                <div class="value">RTX 5090</div>
                            </div>
                        </div>
                    </div>
                    
                    <!-- Services Section -->
                    <div class="services-section">
                        <div class="section-header">
                            <h2 class="section-title">
                                AI Services
                                <span class="badge">Enterprise</span>
                            </h2>
                        </div>
                        
                        <div class="service-grid">
            `;
            
            // Add service cards
            for (const service of services) {
                const isOnline = servicesStatus[service.id] || false;
                const statusClass = isOnline ? '' : 'offline';
                const statusText = isOnline ? 'Online' : 'Offline';
                
                let actionHtml = '';
                if (service.custom_url) {
                    actionHtml = `<a href="${service.custom_url}" class="service-action" target="_blank">Launch Service</a>`;
                } else if (service.url === 'auto' && !service.apiOnly) {
                    let serviceUrl;
                    if (IS_SUBDOMAIN) {
                        // When accessed via subdomain, use proper subdomain URLs
                        const baseDomain = window.location.hostname.replace(/^[^.]+\./, '');
                        if (service.id === 'chat') {
                            serviceUrl = `https://chat.${baseDomain}`;
                        } else if (service.id === 'search') {
                            serviceUrl = `https://search.${baseDomain}`;
                        } else if (service.id === 'orator') {
                            serviceUrl = `https://tts.${baseDomain}`;
                        } else if (service.id === 'amanuensis') {
                            serviceUrl = `https://amanuensis.yoda.unicorncommander.ai/web`;
                        } else {
                            // For other services, construct subdomain if available
                            serviceUrl = `https://${service.id}.${baseDomain}`;
                        }
                    } else {
                        // Local access - use hostname with port
                        if (service.id === 'amanuensis') {
                            serviceUrl = `http://${window.location.hostname}:${service.port}/web`;
                        } else {
                            serviceUrl = `http://${window.location.hostname}:${service.port}`;
                        }
                    }
                    actionHtml = `<a href="${serviceUrl}" class="service-action" target="_blank">Launch Service</a>`;
                } else if (service.apiOnly) {
                    actionHtml = `<div style="padding: 0.625rem 1.25rem; background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 50px; text-align: center; color: var(--text-muted); font-size: 0.875rem;">API Service</div>`;
                }
                
                html += `
                    <div class="service-card">
                        <div class="service-header">
                            ${service.logo_url ? 
                                `<div class="service-logo">
                                    <img src="${service.logo_url}" alt="${service.name}" 
                                         onerror="this.parentElement.className='service-icon'; this.parentElement.innerHTML='${service.icon || '🔧'}'">
                                </div>` :
                                `<div class="service-icon">${service.icon || '🔧'}</div>`
                            }
                            <div class="service-meta">
                                <div class="service-name">${service.name}</div>
                                ${!service.hide_status ? `<div class="service-status ${statusClass}">${statusText}</div>` : ''}
                            </div>
                        </div>
                        <p class="service-description">${service.description}</p>
                        ${actionHtml}
                    </div>
                `;
            }
            
            html += `
                        </div>
                    </div>
            `;
            
            // Add admin section if enabled
            if (adminSection.enabled) {
                html += `
                    <div class="admin-section">
                        <div class="admin-content">
                            <h3>${adminSection.title}</h3>
                            <p>${adminSection.description}</p>
                            <a href="/admin" class="admin-btn">
                                ${adminSection.button_emoji ? `<span>${adminSection.button_emoji}</span>` : ''}
                                ${adminSection.button_text}
                            </a>
                        </div>
                    </div>
                `;
            }
            
            html += '</div>';
            
            document.getElementById('app').innerHTML = html;
            document.title = branding.company_name || 'UC-1 Pro';
            
            // Focus search input
            setTimeout(() => {
                document.getElementById('searchInput').focus();
            }, 100);
        }
        
        // Load user info
        async function loadUserInfo() {
            try {
                const response = await fetch(`${BASE_URL}/auth/user`);
                if (response.ok) {
                    const data = await response.json();
                    const user = data.user;
                    const userName = user.name || user.username || 'User';
                    document.getElementById('userName').textContent = userName;
                    document.getElementById('userAvatar').textContent = userName[0].toUpperCase();
                } else {
                    window.location.href = '/auth/login';
                }
            } catch (error) {
                console.error('Failed to load user info:', error);
                document.getElementById('userName').textContent = 'Guest';
            }
        }
        
        // Check services status
        async function checkServicesStatus() {
            try {
                const response = await fetch(`${BASE_URL}/api/v1/services`);
                if (response.ok) {
                    const data = await response.json();
                    const statusMap = {};
                    
                    for (const service of data.services) {
                        const name = service.name.toLowerCase();
                        if (name.includes('chat') || name.includes('webui')) {
                            statusMap['chat'] = service.status === 'running';
                        } else if (name.includes('search') || name.includes('searxng') || name.includes('center-deep')) {
                            statusMap['search'] = service.status === 'running';
                        } else if (name.includes('vllm')) {
                            statusMap['vllm'] = service.status === 'running';
                        } else if (name.includes('amanuensis') || name.includes('whisper')) {
                            statusMap['amanuensis'] = service.status === 'running';
                        } else if (name.includes('orator')) {
                            statusMap['orator'] = service.status === 'running';
                        } else if (name.includes('qdrant')) {
                            statusMap['qdrant'] = service.status === 'running';
                        }
                    }
                    
                    servicesStatus = statusMap;
                }
            } catch (error) {
                console.error('Failed to check services:', error);
            }
        }
        
        // Load configuration
        async function loadConfiguration() {
            try {
                const response = await fetch(`${BASE_URL}/api/v1/landing/config`);
                if (response.ok) {
                    landingConfig = await response.json();
                    
                    // Apply user's saved theme or use config default
                    const themeToApply = userTheme || 
                                       (landingConfig.theme.preset === 'dashboard' ? 'dark' : 
                                        landingConfig.theme.preset === 'magic-unicorn' ? 'unicorn' : 'dark');
                    
                    applyTheme(themeToApply);
                    await checkServicesStatus();
                    renderLandingPage(landingConfig);
                    await loadUserInfo();
                } else {
                    // Fallback to static page
                    window.location.href = '/index.html';
                }
            } catch (error) {
                console.error('Failed to load configuration:', error);
                window.location.href = '/index.html';
            }
        }
        
        // Logout function
        function logout() {
            if (confirm('Are you sure you want to logout?')) {
                window.location.href = `${BASE_URL}/auth/logout`;
            }
        }
        
        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            loadConfiguration();
        });
        
        // Make functions globally available
        window.handleSearch = handleSearch;
        window.applyTheme = applyTheme;
        window.logout = logout;
    </script>
</body>
</html>
