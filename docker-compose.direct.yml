version: '3.8'

services:
  # Direct routing to ops-center backend
  ops-center-direct:
    image: uc-1-pro-ops-center
    container_name: ops-center-direct
    restart: unless-stopped
    ports:
      - "8084:8084"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./backend:/app
      - ./public:/app/public
    environment:
      - EXTERNAL_HOST=unicorncommander.ai
      - EXTERNAL_PROTOCOL=https
      - OAUTH_CLIENT_ID=ops-center
      - OPS_CENTER_OAUTH_CLIENT_SECRET=REMOVED
      - KEYCLOAK_URL=http://uchub-keycloak:8080
      - KEYCLOAK_REALM=uchub
      - KEYCLOAK_ADMIN_USER=admin
      - KEYCLOAK_ADMIN_PASSWORD=REMOVED-KEYCLOAK_ADMIN_PASSWORD
      - SESSION_SECRET_KEY=REMOVED-SESSION_SECRET_KEY
      # Stripe Configuration
      - SREMOVED
      - STRIPE_SECRET_KEY=sREMOVED
      - STRIPE_API_KEY=sREMOVED
      - SREMOVED
      - STRIPE_SUCCESS_URL=https://unicorncommander.ai/signup-flow.html?success=true
      - STRIPE_CANCEL_URL=https://unicorncommander.ai/signup-flow.html?canceled=true
      # Lago Configuration
      - LAGO_API_URL=http://unicorn-lago-api:3000
      - LAGO_PUBLIC_URL=https://billing-api.unicorncommander.ai
      - LREMOVED
      # Redis for sessions
      - REDIS_URL=redis://unicorn-lago-redis:6379/0
      # PostgreSQL Database
      - POSTGRES_HOST=unicorn-postgresql
      - POSTGRES_PORT=5432
      - POSTGRES_USER=unicorn
      - POSTGRES_PASSWORD=REMOVED
      - POSTGRES_DB=unicorn_db
      # Credential Encryption Key (Fernet)
      - EREMOVED
      # BYOK Encryption Key (for user API keys)
      - BREMOVED
    networks:
      - web
      - unicorn-network
      - uchub-network
    labels:
      - "traefik.enable=true"
      # Main HTTPS route (Cloudflare → Traefik via HTTPS)
      - "traefik.http.routers.ops-center.rule=Host(`unicorncommander.ai`)"
      - "traefik.http.routers.ops-center.entrypoints=https"
      - "traefik.http.routers.ops-center.tls.certresolver=letsencrypt"
      - "traefik.http.routers.ops-center.service=ops-center-svc"
      - "traefik.http.services.ops-center-svc.loadbalancer.server.port=8084"
      # HTTP route (for health checks and fallback)
      - "traefik.http.routers.ops-center-http.rule=Host(`unicorncommander.ai`)"
      - "traefik.http.routers.ops-center-http.entrypoints=http"
      - "traefik.http.routers.ops-center-http.service=ops-center-svc"
      # Note: No redirect middleware - Cloudflare handles HTTP→HTTPS redirect

networks:
  web:
    external: true
  unicorn-network:
    external: true
  uchub-network:
    external: true