# UC-1 Pro Login Theme Configuration

# Extend parent login theme.
# Keep parent=base: the uc-1-pro pages are standalone FTLs that read stylesCommon and
# kcHtmlClass, so parent=keycloak pulls PatternFly 3 (stock grey background) onto the
# branded sign-in page (measured live 2026-10-24, rolled back). Pages without a uc-1-pro
# override get the branded chrome from login/template.ftl instead.
parent=base

# Import common resources
import=common/keycloak

# Custom styles for login pages
styles=css/login.css

# Custom JavaScript (optional)
# scripts=js/login.js

# Custom logo (set path to your logo)
# logo=/themes/uc-1-pro/login/resources/img/uc-logo.png

# Locale support
locales=en
