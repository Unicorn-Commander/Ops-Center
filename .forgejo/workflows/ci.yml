# CI — Ops-Center (Forgejo Actions)
#
# Runs on the commander-host runner (docker available). Toolchains are pinned
# via job containers (node:20 / python:3.10) with plain `run:` steps — the only
# marketplace action used is actions/checkout, which the pre-existing workflows
# in this repo already depend on.
#
# Jobs:
#   frontend-build   npm ci && npm run build (vite) + bundle-size guard
#   backend-checks   py_compile sweep over backend/**/*.py (excluding the
#                    known-dead server_backup.py / server_complete.py)
#                    + scripts/ci/backend_smoke.py (static: server.py parses,
#                    critical routers imported+included, auth-middleware
#                    public allowlists contain no admin/mutation paths)
#   nav-consistency  scripts/ci/check_nav_consistency.mjs (routes.js vs
#                    App.jsx route table, redirects, flattenRoutes guard)

name: CI — Ops-Center

on:
  push:
    branches:
      - main
      - develop
      - staging
      - 'feat/**'
      - 'fix/**'
  pull_request:

jobs:
  frontend-build:
    name: Frontend build (node 20, vite)
    runs-on: ubuntu-latest
    container:
      image: node:20-bookworm
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        env:
          NODE_OPTIONS: '--max-old-space-size=4096'
        run: npm run build

      - name: Bundle sanity (size guard)
        run: |
          test -d dist || { echo "FAIL: dist/ missing after build"; exit 1; }
          TOTAL=$(du -sh dist/ | cut -f1)
          JS_COUNT=$(find dist/assets -name '*.js' 2>/dev/null | wc -l)
          echo "Bundle size: ${TOTAL} (${JS_COUNT} JS files)"
          SIZE_MB=$(du -sm dist/ | cut -f1)
          if [ "$SIZE_MB" -gt 100 ]; then
            echo "FAIL: bundle size ${SIZE_MB}MB exceeds 100MB limit (stale asset accumulation?)"
            exit 1
          fi

  backend-checks:
    name: Backend checks (python 3.10)
    runs-on: ubuntu-latest
    container:
      image: python:3.10-bookworm
    timeout-minutes: 15
    steps:
      - name: Bootstrap Node 20 for checkout in the Python image
        run: |
          python3 - <<'PY_NODE'
          #!/usr/bin/env python3
          """Supply checkout's Node 20 runtime in the Python 3.10 job image.
          Checksums: https://nodejs.org/dist/v20.20.2/SHASUMS256.txt (2026-09-17).
          """
          import hashlib
          import io
          import os
          import pathlib
          import platform
          import tarfile
          import urllib.request

          RELEASE = 'v20.20.2'
          ARCHIVES = {
              'x86_64': ('x64', 'df770b2a6f130ed8627c9782c988fda9669fa23898329a61a871e32f965e007d'),
              'aarch64': ('arm64', '73093db209e4e9e09dd7d15a47aeaab1b74833830df03efa5f942a1122c5fa71'),
          }

          def main():
              architecture, expected = ARCHIVES[platform.machine()]
              archive_name = f'node-{RELEASE}-linux-{architecture}'
              with urllib.request.urlopen(f'https://nodejs.org/dist/{RELEASE}/{archive_name}.tar.xz', timeout=60) as response:
                  archive = response.read()
              if hashlib.sha256(archive).hexdigest() != expected:
                  raise RuntimeError('Official Node archive checksum mismatch')
              destination = pathlib.Path(os.environ.get('RUNNER_TEMP', '/tmp')) / 'ops-center-ci-node'
              destination.mkdir(parents=True, exist_ok=True)
              with tarfile.open(fileobj=io.BytesIO(archive), mode='r:xz') as bundle:
                  # Extract only the checked Node executable, never archive paths/links.
                  member = bundle.getmember(f'{archive_name}/bin/node')
                  if not member.isfile():
                      raise RuntimeError('Node executable is not a regular archive member')
                  executable = destination / 'node'
                  executable.write_bytes(bundle.extractfile(member).read())
                  executable.chmod(0o755)
              with open(os.environ['GITHUB_PATH'], 'a') as path_file:
                  path_file.write(str(destination) + '\n')
              print(f'Installed checksum-verified Node {RELEASE} for checkout')

          if __name__ == '__main__':
              main()
          PY_NODE

      - name: Checkout
        uses: actions/checkout@v4

      - name: py_compile sweep (backend/**/*.py)
        run: |
          python3 - <<'PYEOF'
          import pathlib, py_compile, sys

          # Known-dead legacy snapshots, not part of the running app.
          EXCLUDE = {"server_backup.py", "server_complete.py"}

          files = sorted(
              f for f in pathlib.Path("backend").rglob("*.py")
              if "__pycache__" not in f.parts and f.name not in EXCLUDE
          )
          fails = []
          for f in files:
              try:
                  py_compile.compile(str(f), doraise=True)
              except py_compile.PyCompileError as e:
                  fails.append(str(e).strip())

          print(f"py_compile: {len(files)} files checked, {len(fails)} failed")
          for e in fails:
              print(f"FAIL: {e}")
          sys.exit(1 if fails else 0)
          PYEOF

      - name: Backend smoke (static import/auth-allowlist gates)
        run: python3 scripts/ci/backend_smoke.py

      - name: Hardcoded credential scan (warn-only)
        run: |
          FINDINGS=$(grep -rnE "sk-[a-zA-Z]*-service-key|MagicUnicorn2025" backend --include='*.py' 2>/dev/null | grep -v "test_" | head -20 || true)
          if [ -n "$FINDINGS" ]; then
            echo "WARNING: possible hardcoded credentials found:"
            echo "$FINDINGS"
            # Warn-only: some hits are env-var defaults; humans triage.
          else
            echo "No hardcoded credential patterns found."
          fi

  nav-consistency:
    name: Nav consistency (routes.js vs App.jsx)
    runs-on: ubuntu-latest
    container:
      image: node:20-bookworm
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check nav/route/redirect consistency
        # Uses node builtins only — no npm install required.
        run: node scripts/ci/check_nav_consistency.mjs
