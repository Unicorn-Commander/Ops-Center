name: CI — Ops-Center

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  syntax-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Verify Python syntax (all backend files)
        run: |
          find backend -name "*.py" -not -path "*/node_modules/*" -not -path "*/__pycache__/*" | \
          xargs python3 -c "
          import ast, sys, pathlib
          errors = []
          for f in sys.argv[1:]:
              try:
                  ast.parse(pathlib.Path(f).read_text())
              except SyntaxError as e:
                  errors.append(f'{f}:{e.lineno}: {e.msg}')
          if errors:
              for e in errors: print(f'FAIL: {e}')
              sys.exit(1)
          print(f'OK: {len(sys.argv)-1} files pass syntax check')
          "

      - name: Check for hardcoded credentials
        run: |
          # Fail if any Python file contains hardcoded API keys or passwords
          FINDINGS=$(grep -rn "sk-[a-zA-Z]*-service-key\|MagicUnicorn2025\|password.*=.*['\"]" backend/*.py backend/**/*.py 2>/dev/null | grep -v "test_\|\.pyc\|CLAUDE\|README\|\.md" | head -20)
          if [ -n "$FINDINGS" ]; then
            echo "WARNING: Possible hardcoded credentials found:"
            echo "$FINDINGS"
            # Don't fail, just warn (some are env var defaults)
          fi

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Check bundle size
        run: |
          TOTAL=$(du -sh dist/ | cut -f1)
          JS_COUNT=$(ls dist/assets/*.js | wc -l)
          echo "Bundle size: $TOTAL ($JS_COUNT JS files)"
          # Fail if over 100MB (indicates stale assets accumulation)
          SIZE_MB=$(du -sm dist/ | cut -f1)
          if [ "$SIZE_MB" -gt 100 ]; then
            echo "FAIL: Bundle size ${SIZE_MB}MB exceeds 100MB limit"
            exit 1
          fi
