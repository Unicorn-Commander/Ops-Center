name: Publish image

# Publishes the Ops-Center image to the Forgejo registry on main pushes and releases.
#
# 2026-10-24: this file used to be the legacy "Forgejo CI/CD Pipeline". Its lint, backend and
# frontend jobs duplicated .forgejo/workflows/ci.yml (the real gate); the frontend job was flaky
# (red on PRs #19-#22, green on #23 with no frontend change), and because docker-build needed
# all three, a flake also skipped publishing (main pushes for #22/#23). Its "Deploy to
# Staging/Production" jobs only echoed text. Only the publish job is kept; ci.yml is the gate.

on:
  push:
    branches: [main]
  release:
    types: [published]

env:
  REGISTRY: git.unicorncommander.ai
  IMAGE_NAME: unicorncommander/ops-center

jobs:
  docker-build:
    name: Build Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Forgejo Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USER }}
          password: ${{ secrets.REGISTRY_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:main
          cache-to: type=inline
